<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <script src="https://cdn.jsdelivr.net/npm/resonance-audio/build/resonance-audio.min.js"></script>
    <link rel='stylesheet' href='css/common.css'>

    <title>Netraudio Technical Demo</title>
  </head>
  <body>
    <header></header>
    <script type="module">
      import {WebXRButton} from './js/util/webxr-button.js';
      import {Scene} from './js/render/scenes/scene.js';
      import {Renderer, createWebGLContext} from './js/render/core/renderer.js';
      import {Node} from './js/render/core/node.js';
      import {Gltf2Node} from './js/render/nodes/gltf2.js';
      import {DropShadowNode} from './js/render/nodes/drop-shadow.js';
      import {vec3} from './js/render/math/gl-matrix.js';

      // XR globals
      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      // Audio scene globals
      const audioContext = new AudioContext();
      const resonance = new ResonanceAudio(audioContext);
      resonance.output.connect(audioContext.destination);
      audioContext.suspend();

      let audioBuffer = null;
      fetch('media/sound/beep.mp3')
        .then(r => r.arrayBuffer())
        .then(ab => audioContext.decodeAudioData(ab))
        .then(decoded => { audioBuffer = decoded; })
        .catch(console.error);

      // Create and start a looping bufferSource at position, return the source so we can stop it later
      function createAudioSource(position) {
        if (audioContext.state === 'suspended') audioContext.resume();
        const source3d = resonance.createSource();
        source3d.setPosition(position[0], position[1], position[2]);

        const bufferSource = audioContext.createBufferSource();
        bufferSource.buffer = audioBuffer;
        bufferSource.loop = true;
        bufferSource.connect(source3d.input);
        bufferSource.start();
        return bufferSource; // Important for stopping later
      }

      // WebGL scene globals
      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);

      let stereo = new Gltf2Node({url: 'media/gltf/stereo/stereo.gltf'});
      arObject.addNode(stereo);

      let reticle = new Gltf2Node({url: 'media/gltf/reticle/reticle.gltf'});
      reticle.visible = false;
      scene.addNode(reticle);
      let reticleHitTestResult = null;

      // Drop shadow
      let shadow = new DropShadowNode();
      vec3.set(shadow.scale, 0.15, 0.15, 0.15);
      arObject.addNode(shadow);

      scene.clear = false; // Transparent background for AR

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession: onRequestSession,
          onEndSession: onEndSession,
          textEnterXRTitle: "NTRD DEBUG",
          textXRNotFoundTitle: "UNSUPPORTED",
          textExitXRTitle: "EXIT",
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar')
                      .then((supported) => { xrButton.enabled = supported; });
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {requiredFeatures: ['local', 'hit-test', 'anchors']})
                           .then((session) => {
          xrButton.setSession(session);
          onSessionStarted(session);
        });
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (!gl) {
          gl = createWebGLContext({ xrCompatible: true });
          renderer = new Renderer(gl);
          scene.setRenderer(renderer);
        }

        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrViewerSpace = refSpace;
          session.requestHitTestSource({ space: xrViewerSpace }).then((hitTestSource) => {
            xrHitTestSource = hitTestSource;
          });
        });

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onEndSession(session) {
        // Stop all audio sources before clearing objects
        anchoredObjects.forEach(obj => {
          if (obj.audioSource) {
            try {
              obj.audioSource.stop(0);
              obj.audioSource.disconnect();
            } catch (e) {
              console.warn('Audio already stopped:', e);
            }
          }
        });

        audioContext.suspend();

        anchoredObjects = [];

        if (xrHitTestSource) {
          xrHitTestSource.cancel();
          xrHitTestSource = null;
        }

        session.end();
      }

      function onSessionEnded(event) {
        xrButton.setSession(null);
      }

      const MAX_ANCHORED_OBJECTS = 4;
      let anchoredObjects = [];

      function addAnchoredObjectsToScene(anchor, position) {
        let stereo = new Gltf2Node({url: 'media/gltf/stereo/stereo.gltf'});
        scene.addNode(stereo);

        // Create audio at the same position
        let bufferSource = createAudioSource(position);

        anchoredObjects.push({
          anchoredObject: stereo,
          anchor: anchor,
          audioSource: bufferSource
        });

        // Remove oldest if over limit
        if (anchoredObjects.length > MAX_ANCHORED_OBJECTS) {
          let objectToRemove = anchoredObjects.shift();
          scene.removeNode(objectToRemove.anchoredObject);
          objectToRemove.anchor.delete();

          if (objectToRemove.audioSource) {
            try {
              objectToRemove.audioSource.stop();
              objectToRemove.audioSource.disconnect();
            } catch (e) {
              console.warn('Audio source already stopped:', e);
            }
          }
        }
      }

      function onSelect(event) {
        if (reticle.visible) {
          reticleHitTestResult.createAnchor().then((anchor) => {
            const pose = reticleHitTestResult.getPose(xrRefSpace);
            const position = [
              pose.transform.position.x,
              pose.transform.position.y,
              pose.transform.position.z
            ];

            addAnchoredObjectsToScene(anchor, position);
          }, (error) => {
            console.error("Could not create anchor: " + error);
          });
        }
      }

      function onXRFrame(t, frame) {
        let session = frame.session;
        let pose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;

        if (xrHitTestSource && pose) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(xrRefSpace);
            reticle.visible = true;
            reticle.matrix = pose.transform.matrix;
            reticleHitTestResult = hitTestResults[0];
          }
        }

        for (const {anchoredObject, anchor} of anchoredObjects) {
          if (!frame.trackedAnchors.has(anchor)) continue;
          const anchorPose = frame.getPose(anchor.anchorSpace, xrRefSpace);
          anchoredObject.matrix = anchorPose.transform.matrix;
        }

        scene.startFrame();
        session.requestAnimationFrame(onXRFrame);
        scene.drawXRFrame(frame, pose);
        scene.endFrame();
      }

      initXR();
    </script>
  </body>
</html>
