<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <script src="https://cdn.jsdelivr.net/npm/resonance-audio/build/resonance-audio.min.js"></script>
    <link rel='stylesheet' href='css/common.css'>

    <title>Netraudio Technical Demo</title>
  </head>
  <body>
    <header></header>
    <script type="module">
      import {WebXRButton} from './js/util/webxr-button.js';
      import {Scene} from './js/render/scenes/scene.js';
      import {Renderer, createWebGLContext} from './js/render/core/renderer.js';
      import {Node} from './js/render/core/node.js';
      import {Gltf2Node} from './js/render/nodes/gltf2.js';
      import {DropShadowNode} from './js/render/nodes/drop-shadow.js';
      import {mat4, vec3} from './js/render/math/gl-matrix.js';

      // XR globals
      let xrButton = null;
      let xrRefSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;

      // Audio globals
      const ANALYSER_FFT_SIZE = 1024;
      const audioContext = new AudioContext();
      const resonance = new ResonanceAudio(audioContext);
      resonance.output.connect(audioContext.destination);
      audioContext.suspend();

      let audioBuffer = null;
      fetch('media/sound/beep.mp3')
        .then(r => r.arrayBuffer())
        .then(ab => audioContext.decodeAudioData(ab))
        .then(decoded => { audioBuffer = decoded; })
        .catch(console.error);

      // Create and start audio source with analyser
      function createAudioSource(position) {
        if (audioContext.state === 'suspended') audioContext.resume();

        const source3d = resonance.createSource();
        source3d.setPosition(position[0], position[1], position[2]);

        const analyser = audioContext.createAnalyser();
        analyser.fftSize = ANALYSER_FFT_SIZE;
        analyser.lastRMSdB = 0;

        const bufferSource = audioContext.createBufferSource();
        bufferSource.buffer = audioBuffer;
        bufferSource.loop = true;
        bufferSource.connect(source3d.input);
        bufferSource.connect(analyser);
        bufferSource.start();

        return { bufferSource, analyser, source3d };
      }

      let fftBuffer = new Float32Array(ANALYSER_FFT_SIZE);
      function getLoudnessScale(analyser) {
        analyser.getFloatTimeDomainData(fftBuffer);
        let sum = 0;
        for (let i = 0; i < fftBuffer.length; ++i) sum += fftBuffer[i] * fftBuffer[i];

        let rms = Math.sqrt(sum / fftBuffer.length);
        let db = 30 + 10 / Math.LN10 * Math.log(rms <= 0 ? 0.0001 : rms);

        analyser.lastRMSdB += 0.525 * ((db < 0 ? 0 : db) - analyser.lastRMSdB);

        return Math.max(0.3, analyser.lastRMSdB / 30.0);
      }

      function updateAudioNodes(frame, viewerPose) {
        const THRESHOLD = 0.6; // 60 cm
        const viewerPos = viewerPose.transform.position;

        // Determine the first active anchor (only this one plays/removes)
        let firstActiveAnchor = anchoredObjects.length > 0 ? anchoredObjects[0].anchor : null;

        if (!firstActiveAnchor) return;

        for (let obj of [...anchoredObjects]) {
          const { anchoredObject, anchor, analyser, source3d, audioSource: bufferSource } = obj;

          if (!frame.trackedAnchors.has(anchor)) continue;

          const anchorPose = frame.getPose(anchor.anchorSpace, xrRefSpace);
          if (!anchorPose) continue;

          anchoredObject.matrix.set(anchorPose.transform.matrix);

          const p = anchorPose.transform.position;
          source3d.setPosition(p.x, p.y, p.z);

          // Sound logic: only first stereo plays
          if (anchor === firstActiveAnchor) {
            const dx = p.x - viewerPos.x;
            const dy = p.y - viewerPos.y;
            const dz = p.z - viewerPos.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

            if (distance < THRESHOLD) {
              // Remove only the first anchor if too close
              scene.removeNode(anchoredObject);
              anchor.delete();

              try {
                bufferSource.stop();
                bufferSource.disconnect();
              } catch (e) {
                console.warn('Audio source already stopped:', e);
              }

              anchoredObjects = anchoredObjects.filter(o => o.anchor !== anchor);

              // Exit after removal so we don't modify while iterating
              return;
            }

            // Play sound and apply scale for the active stereo based on getLoudnessScale
            source3d.setGain(1);
            const scale = getLoudnessScale(analyser);
            mat4.scale(anchoredObject.matrix, anchoredObject.matrix, [scale, scale, scale]);
          } else {
            // Mute all other stereos and apply fixed scale
            source3d.setGain(0);
            const scale = 0.3;
            mat4.scale(anchoredObject.matrix, anchoredObject.matrix, [scale, scale, scale]);
          }
        }
      }

      // WebGL scene globals
      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.enableStats(false);

      let arObject = new Node();
      arObject.visible = false;
      scene.addNode(arObject);

      let stereo = new Gltf2Node({url: 'media/gltf/stereo/stereo.gltf'});
      arObject.addNode(stereo);

      let reticle = new Gltf2Node({url: 'media/gltf/reticle/reticle.gltf'});
      reticle.visible = false;
      scene.addNode(reticle);
      let reticleHitTestResult = null;

      // Drop shadow
      let shadow = new DropShadowNode();
      vec3.set(shadow.scale, 0.15, 0.15, 0.15);
      arObject.addNode(shadow);

      scene.clear = false; // Transparent background for AR

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession: onRequestSession,
          onEndSession: onEndSession,
          textEnterXRTitle: "NTRD DEBUG",
          textXRNotFoundTitle: "UNSUPPORTED",
          textExitXRTitle: "EXIT",
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar')
                      .then((supported) => { xrButton.enabled = supported; });
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {requiredFeatures: ['local', 'hit-test', 'anchors']})
                           .then((session) => {
          xrButton.setSession(session);
          onSessionStarted(session);
        });
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (!gl) {
          gl = createWebGLContext({ xrCompatible: true });
          renderer = new Renderer(gl);
          scene.setRenderer(renderer);
        }

        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrViewerSpace = refSpace;
          session.requestHitTestSource({ space: xrViewerSpace }).then((hitTestSource) => {
            xrHitTestSource = hitTestSource;
          });
        });

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onEndSession(session) {
        anchoredObjects.forEach(obj => {
          if (obj.audioSource) {
            try {
              obj.audioSource.stop();
              obj.audioSource.disconnect();
            } catch (e) {
              console.warn('Audio already stopped:', e);
            }
          }
        });

        anchoredObjects = [];

        if (xrHitTestSource) {
          xrHitTestSource.cancel();
          xrHitTestSource = null;
        }

        session.end();
      }

      function onSessionEnded(event) {
        xrButton.setSession(null);
        audioContext.suspend();
      }

      const MAX_ANCHORED_OBJECTS = 4;
      let anchoredObjects = []; // {anchoredObject, anchor, audioSource, analyser, source3d}
      let lineObjects = []; // { node, anchorA, anchorB }

      function createLineNode() {
        const node = new Node();
        node.updateEndpoints = function(start, end) {
          this.start = start;
          this.end = end;
        };
        node.onRender = function() {
          if (!this.start || !this.end) return;

          const positions = new Float32Array([
            this.start.x, this.start.y, this.start.z,
            this.end.x, this.end.y, this.end.z
          ]);

          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);

          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.LINES, 0, 2);
        };
        return node;
      }

      function updateLines(frame) {
        for (let line of lineObjects) {
          const poseA = frame.getPose(line.anchorA.anchorSpace, xrRefSpace);
          const poseB = frame.getPose(line.anchorB.anchorSpace, xrRefSpace);

          if (poseA && poseB) {
            line.node.updateEndpoints(poseA.transform.position, poseB.transform.position);
          }
        }
      }

      function addAnchoredObjectsToScene(anchor, position) {
        let stereo = new Gltf2Node({ url: 'media/gltf/stereo/stereo.gltf' });
        scene.addNode(stereo);

        let { bufferSource, analyser, source3d } = createAudioSource(position);

        anchoredObjects.push({
          anchoredObject: stereo,
          anchor: anchor,
          audioSource: bufferSource,
          analyser: analyser,
          source3d: source3d
        });

        // If there is a previous anchor, create a line node
        if (anchoredObjects.length > 1) {
          let prevAnchor = anchoredObjects[anchoredObjects.length - 2].anchor;
          let lineNode = createLineNode();
          scene.addNode(lineNode);
          lineObjects.push({ node: lineNode, anchorA: prevAnchor, anchorB: anchor });
        }

        // Remove old objects if over max
        if (anchoredObjects.length > MAX_ANCHORED_OBJECTS) {
          let objectToRemove = anchoredObjects.shift();
          scene.removeNode(objectToRemove.anchoredObject);
          objectToRemove.anchor.delete();

          if (objectToRemove.audioSource) {
            try {
              objectToRemove.audioSource.stop();
              objectToRemove.audioSource.disconnect();
            } catch (e) {
              console.warn('Audio source already stopped:', e);
            }
          }

          // Remove any line connected to this anchor
          lineObjects = lineObjects.filter(line => {
            if (line.anchorA === objectToRemove.anchor || line.anchorB === objectToRemove.anchor) {
              scene.removeNode(line.node);
              return false;
            }
            return true;
          });
        }
      }

      function onSelect(event) {
        if (reticle.visible) {
          reticleHitTestResult.createAnchor().then((anchor) => {
            const pose = reticleHitTestResult.getPose(xrRefSpace);
            const position = [
              pose.transform.position.x,
              pose.transform.position.y,
              pose.transform.position.z
            ];
            addAnchoredObjectsToScene(anchor, position);
          }, (error) => {
            console.error("Could not create anchor: " + error);
          });
        }
      }

      function onXRFrame(t, frame) {
        let session = frame.session;
        let viewerPose = frame.getViewerPose(xrRefSpace);

        reticle.visible = false;

        if (xrHitTestSource && viewerPose) {
          let hitTestResults = frame.getHitTestResults(xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(xrRefSpace);
            reticle.visible = true;
            reticle.matrix = pose.transform.matrix;
            reticleHitTestResult = hitTestResults[0];
          }
        }

        if (viewerPose) {
          resonance.setListenerFromMatrix({elements: viewerPose.transform.matrix});
          updateAudioNodes(frame, viewerPose);
        }

        updateLines(frame);
      
        scene.startFrame();
        session.requestAnimationFrame(onXRFrame);
        scene.drawXRFrame(frame, viewerPose);
        scene.endFrame();
      }

      initXR();
    </script>
  </body>
</html>
